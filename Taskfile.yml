version: '3'

env:
  GITHUB_PAGES_URL: toshy.github.io/animethemes-moe-tracker
  ANIMETHEMES_ENDPOINT: https://graphql.animethemes.moe/
  ANIMETHEMES_DOWNLOAD_WORKERS: '4'
  ANIMETHEMES_PAGE_SIZE: '100'
  ANIMETHEMES_HEALTHCHECK_TIMEOUT_SECONDS: '10'

tasks:
  default:
    cmds:
      - task --list

  animethemes:fetch:
    desc: Fetch and process animethemes.moe data (orchestrator)
    cmds:
      - task: animethemes:healthcheck
      - task: animethemes:download
      - task: animethemes:manifest

  animethemes:incremental:
    desc: Incremental refresh — pull the most recently updated anime and merge
    summary: |
      Requires: curl, jq, awk, sha256sum
      Downloads the first `ANIMETHEMES_INCREMENTAL_PAGES` pages of the
      animePagination query sorted by UPDATED_AT_DESC (default: 1 page = the
      100 most recently updated anime), then merges the result into the
      existing data/manifest.json. Anime not seen in this run are preserved.

      For each anime touched:
        - new (not in manifest)          → file written, manifest entry added
        - in manifest, sha256 unchanged  → file rewritten with identical bytes,
                                            timestamps preserved (no-op for git)
        - in manifest, sha256 changed    → file rewritten, updatedAt bumped
    silent: true
    cmds:
      - task: animethemes:healthcheck
      - |
        set -euo pipefail

        pages="${ANIMETHEMES_INCREMENTAL_PAGES:-1}"
        if ! [[ "$pages" =~ ^[1-9][0-9]*$ ]]; then
          echo "Invalid ANIMETHEMES_INCREMENTAL_PAGES: ${pages}"
          exit 1
        fi

        # This is the "what changed recently?" path: pull the most recently
        # UPDATED anime first. Exported so the nested `download:page` calls
        # below inherit it (override by setting ANIMETHEMES_SORT yourself).
        export ANIMETHEMES_SORT="${ANIMETHEMES_SORT:-UPDATED_AT_DESC}"

        cache_dir=".cache/pages"
        rm -rf "$cache_dir"
        mkdir -p "$cache_dir"

        echo "Incremental fetch: first ${pages} page(s) sorted ${ANIMETHEMES_SORT}."
        i=1
        while [ "$i" -le "$pages" ]; do
          task animethemes:download:page PAGE="$i"
          i=$((i + 1))
        done
      - task: animethemes:manifest

  animethemes:healthcheck:
    desc: Fast availability check for animethemes.moe GraphQL endpoint
    summary: |
      Requires: curl, jq
      Performs a minimal `{ __typename }` query and exits early on failure.
    silent: true
    cmds:
      - |
        set -euo pipefail

        timeout="${ANIMETHEMES_HEALTHCHECK_TIMEOUT_SECONDS:-10}"
        echo "Healthcheck: probing ${ANIMETHEMES_ENDPOINT}..."

        payload='{"query":"query{__typename}"}'

        response_file="$(mktemp)"
        trap 'rm -f "$response_file"' EXIT

        curl --fail \
          --max-time "$timeout" \
          --connect-timeout 5 \
          --http1.1 \
          -sS \
          -X POST "${ANIMETHEMES_ENDPOINT}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          -H "Origin: ${ANIMETHEMES_ENDPOINT%/}" \
          -H "Referer: ${ANIMETHEMES_ENDPOINT}" \
          -H 'User-Agent: animethemes-moe-tracker/1.0' \
          --data "$payload" \
          -o "$response_file" || {
            echo "Healthcheck failed: animethemes.moe GraphQL is not reachable right now."
            exit 1
          }

        typename=$(jq -r '.data.__typename // "missing"' "$response_file" 2>/dev/null || echo invalid)
        if [ "$typename" != "Query" ]; then
          echo "Healthcheck failed: unexpected GraphQL response:"
          cat "$response_file"
          exit 1
        fi

        echo "Healthcheck OK."

  animethemes:probe:
    desc: Probe the animethemes.moe GraphQL endpoint for pagination info (page 1)
    summary: |
      Requires: curl, jq
      Prints a JSON object: {"lastPage": N, "total": M, "pages": [1,2,...,N]}
      Useful for driving CI matrix fan-out.
    silent: true
    cmds:
      - |
        set -euo pipefail

        page_size="${ANIMETHEMES_PAGE_SIZE:-100}"

        query=$(cat <<'GQL'
        query Probe($page: Int!, $first: Int!) {
          animePagination(first: $first, page: $page, sort: CREATED_AT) {
            paginatorInfo {
              currentPage
              lastPage
              total
            }
          }
        }
        GQL
        )

        payload=$(
          jq -nc \
            --arg query "$query" \
            --argjson page 1 \
            --argjson first "$page_size" \
            '{query:$query,variables:{page:$page,first:$first},operationName:"Probe"}'
        )

        response_file="$(mktemp)"
        trap 'rm -f "$response_file"' EXIT

        curl --fail \
          --max-time 30 \
          --connect-timeout 10 \
          --http1.1 \
          -sS \
          -X POST "${ANIMETHEMES_ENDPOINT}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          -H "Origin: ${ANIMETHEMES_ENDPOINT%/}" \
          -H "Referer: ${ANIMETHEMES_ENDPOINT}" \
          -H 'User-Agent: animethemes-moe-tracker/1.0' \
          --data "$payload" \
          -o "$response_file"

        last_page=$(jq -r '.data.animePagination.paginatorInfo.lastPage // "null"' "$response_file" 2>/dev/null || echo null)
        if [ "$last_page" = "null" ] || [ -z "$last_page" ]; then
          echo "Probe failed:" >&2
          cat "$response_file" >&2
          exit 1
        fi

        jq -c '
          .data.animePagination.paginatorInfo as $p
          | {lastPage: $p.lastPage, total: $p.total, pages: [range(1; $p.lastPage + 1)]}
        ' "$response_file"

  animethemes:download:page:
    desc: Download a single GraphQL page into the cache
    summary: |
      Requires: curl, jq
      Usage: task animethemes:download:page PAGE=1
      Sort: reads $ANIMETHEMES_SORT (default CREATED_AT). The incremental cron
      sets UPDATED_AT_DESC so the most recently updated anime are fetched first.
      Writes .cache/pages/<page>.json
    requires:
      vars:
        - PAGE
    silent: true
    cmds:
      - |
        set -euo pipefail

        page="{{.PAGE}}"
        if ! [[ "$page" =~ ^[1-9][0-9]*$ ]]; then
          echo "Invalid PAGE. Example: task animethemes:download:page PAGE=1"
          exit 1
        fi

        # Sort column for animePagination. Defaults to CREATED_AT (stable page
        # contents for full-refresh matrix reruns); the incremental cron sets
        # ANIMETHEMES_SORT=UPDATED_AT_DESC to pull the freshest-updated anime.
        sort_col="${ANIMETHEMES_SORT:-CREATED_AT}"
        case "$sort_col" in
          CREATED_AT|CREATED_AT_DESC|UPDATED_AT|UPDATED_AT_DESC) ;;
          *)
            echo "Invalid ANIMETHEMES_SORT: '${sort_col}' (allowed: CREATED_AT, CREATED_AT_DESC, UPDATED_AT, UPDATED_AT_DESC)." >&2
            exit 1
            ;;
        esac

        page_size="${ANIMETHEMES_PAGE_SIZE:-100}"
        cache_dir=".cache/pages"
        mkdir -p "$cache_dir"
        outfile="$cache_dir/${page}.json"

        query=$(cat <<'GQL'
        query GetAnime($page: Int!, $first: Int!) {
          animePagination(
            first: $first
            page: $page
            sort: __SORT__
          ) {
            paginatorInfo {
              currentPage
              lastPage
              hasMorePages
              total
            }

            data {
              id
              title {
                romaji
                english
                native
              }
              slug
              synopsis
              format
              season
              year
              createdAt
              updatedAt

              resources {
                nodes {
                  site
                  externalId
                }
              }

              images(first: 100) {
                nodes {
                  id
                  facet
                  path
                }
              }

              studios(first: 100) {
                nodes {
                  id
                  name
                  slug
                }
              }

              series(first: 100) {
                nodes {
                  id
                  name
                  slug
                }
              }

              animethemes(first: 1000) {
                id
                slug
                type
                sequence

                song {
                  id
                  title {
                    romaji
                    native
                  }
                }

                animethemeentries(first: 1000) {
                  id
                  version
                  episodes
                  nsfw
                  spoiler

                  videos(first: 1000) {
                    nodes {
                      id
                      basename
                      filename
                      link
                      mimetype
                      size
                      resolution
                      nc
                      subbed
                      lyrics
                      overlap
                      source
                      tags

                      audio {
                        id
                        basename
                        filename
                        link
                        mimetype
                        size
                      }
                    }
                  }
                }
              }
            }
          }
        }
        GQL
        )
        query=${query//__SORT__/$sort_col}

        payload=$(
          jq -nc \
            --arg query "$query" \
            --argjson page "$page" \
            --argjson first "$page_size" \
            '{query:$query,variables:{page:$page,first:$first},operationName:"GetAnime"}'
        )

        echo "Fetching page ${page}..."

        attempt=1
        max_attempts=4
        tmp_response="$(mktemp)"
        trap 'rm -f "$tmp_response"' EXIT
        success=0
        while [ "$attempt" -le "$max_attempts" ]; do
          if curl --fail \
              --max-time 90 \
              --connect-timeout 10 \
              --http1.1 \
              -sS \
              -X POST "${ANIMETHEMES_ENDPOINT}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Origin: ${ANIMETHEMES_ENDPOINT%/}" \
              -H "Referer: ${ANIMETHEMES_ENDPOINT}" \
              -H 'User-Agent: animethemes-moe-tracker/1.0' \
              --data "$payload" \
              -o "$tmp_response"; then
            success=1
            break
          fi
          echo "Page ${page}: curl failed (attempt ${attempt}/${max_attempts})." >&2
          attempt=$((attempt + 1))
          sleep $((attempt * 2))
        done

        if [ "$success" -ne 1 ]; then
          echo "Page ${page}: giving up after ${max_attempts} attempts." >&2
          exit 1
        fi

        data_type=$(jq -r '(.data.animePagination.data | type) // "missing"' "$tmp_response" 2>/dev/null || echo invalid)
        if [ "$data_type" != "array" ]; then
          echo "Page ${page}: GraphQL response did not contain data.animePagination.data array (got: ${data_type}, $(wc -c < "$tmp_response") bytes)." >&2
          head -c 500 "$tmp_response" >&2
          echo >&2
          exit 1
        fi

        has_errors=$(jq -r '(.errors // null) | tojson' "$tmp_response" 2>/dev/null || echo null)
        if [ "$has_errors" != "null" ]; then
          echo "Page ${page}: GraphQL returned partial errors (continuing): ${has_errors}" >&2
        fi

        jq -c . "$tmp_response" > "$outfile"
        count=$(jq '.data.animePagination.data | length' "$outfile")
        last_page=$(jq '.data.animePagination.paginatorInfo.lastPage' "$outfile")
        echo "Page ${page}/${last_page}: ${count} entries -> ${outfile}"

  animethemes:download:
    desc: Download all GraphQL pages in parallel
    summary: |
      Requires: curl, jq, xargs
      Probes pagination, then downloads every page into .cache/pages/.
      Worker count is controlled by ANIMETHEMES_DOWNLOAD_WORKERS (default: 4).
    silent: true
    cmds:
      - |
        set -euo pipefail

        cache_dir=".cache/pages"
        rm -rf "$cache_dir"
        mkdir -p "$cache_dir"

        probe_json=$(task animethemes:probe)
        last_page=$(echo "$probe_json" | jq -r '.lastPage')
        total=$(echo "$probe_json" | jq -r '.total')

        if ! [[ "$last_page" =~ ^[1-9][0-9]*$ ]]; then
          echo "Probe returned no usable lastPage."
          exit 1
        fi

        workers="${ANIMETHEMES_DOWNLOAD_WORKERS:-4}"
        if ! [[ "$workers" =~ ^[1-9][0-9]*$ ]]; then
          workers=4
        fi
        if [ "$workers" -gt "$last_page" ]; then
          workers="$last_page"
        fi

        echo "Total anime: ${total}. Pages: ${last_page}. Workers: ${workers}."

        # Sort column for animePagination (default CREATED_AT keeps page
        # contents stable across reruns). Honors ANIMETHEMES_SORT for parity
        # with the incremental and full-refresh paths.
        sort_col="${ANIMETHEMES_SORT:-CREATED_AT}"
        case "$sort_col" in
          CREATED_AT|CREATED_AT_DESC|UPDATED_AT|UPDATED_AT_DESC) ;;
          *)
            echo "Invalid ANIMETHEMES_SORT: '${sort_col}' (allowed: CREATED_AT, CREATED_AT_DESC, UPDATED_AT, UPDATED_AT_DESC)." >&2
            exit 1
            ;;
        esac

        # Write the GraphQL query and a self-contained worker script to a
        # temp dir to avoid Task per-invocation overhead inside xargs.
        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT

        query_file="$work_dir/query.graphql"
        cat > "$query_file" <<'GQL'
        query GetAnime($page: Int!, $first: Int!) {
          animePagination(
            first: $first
            page: $page
            sort: __SORT__
          ) {
            paginatorInfo { currentPage lastPage hasMorePages total }
            data {
              id title { romaji english native } slug synopsis format season year createdAt updatedAt
              resources { nodes { site externalId } }
              images(first: 100) { nodes { id facet path } }
              studios(first: 100) { nodes { id name slug } }
              series(first: 100) { nodes { id name slug } }
              animethemes(first: 1000) {
                id slug type sequence
                song { id title { romaji native } }
                animethemeentries(first: 1000) {
                  id version episodes nsfw spoiler
                  videos(first: 1000) {
                    nodes {
                      id basename filename link mimetype size resolution
                      nc subbed lyrics overlap source tags
                      audio { id basename filename link mimetype size }
                    }
                  }
                }
              }
            }
          }
        }
        GQL
        sed -i "s/__SORT__/${sort_col}/" "$query_file"

        worker="$work_dir/fetch_page.sh"
        cat > "$worker" <<'WORKER'
        #!/usr/bin/env bash
        set -euo pipefail
        page="$1"
        endpoint="${ANIMETHEMES_ENDPOINT:?}"
        page_size="${ANIMETHEMES_PAGE_SIZE:-100}"
        cache_dir="${CACHE_DIR:?}"
        query_file="${QUERY_FILE:?}"

        outfile="$cache_dir/${page}.json"
        tmp_response="$(mktemp)"
        trap 'rm -f "$tmp_response"' EXIT

        payload="$(jq -nc \
          --rawfile query "$query_file" \
          --argjson page "$page" \
          --argjson first "$page_size" \
          '{query:$query,variables:{page:$page,first:$first},operationName:"GetAnime"}')"

        attempt=1
        max_attempts=4
        success=0
        while [ "$attempt" -le "$max_attempts" ]; do
          if curl --fail \
              --max-time 90 \
              --connect-timeout 10 \
              --http1.1 \
              -sS \
              -X POST "$endpoint" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Origin: ${endpoint%/}" \
              -H "Referer: $endpoint" \
              -H 'User-Agent: animethemes-moe-tracker/1.0' \
              --data "$payload" \
              -o "$tmp_response"; then
            success=1
            break
          fi
          echo "Page ${page}: curl failed (attempt ${attempt}/${max_attempts})." >&2
          attempt=$((attempt + 1))
          sleep $((attempt * 2))
        done

        if [ "$success" -ne 1 ]; then
          echo "Page ${page}: giving up after ${max_attempts} attempts." >&2
          exit 1
        fi

        data_type="$(jq -r '(.data.animePagination.data | type) // "missing"' "$tmp_response" 2>/dev/null || echo invalid)"
        if [ "$data_type" != "array" ]; then
          echo "Page ${page}: GraphQL response did not contain data array (got: $data_type)." >&2
          head -c 500 "$tmp_response" >&2
          echo >&2
          exit 1
        fi

        jq -c . "$tmp_response" > "$outfile"
        count=$(jq '.data.animePagination.data | length' "$outfile")
        echo "Page ${page}: ${count} entries"
        WORKER
        chmod +x "$worker"

        export ANIMETHEMES_ENDPOINT
        export ANIMETHEMES_PAGE_SIZE
        export CACHE_DIR="$cache_dir"
        export QUERY_FILE="$query_file"

        seq 1 "$last_page" | xargs -P "$workers" -n 1 "$worker"

        downloaded=$(ls "$cache_dir"/*.json 2>/dev/null | wc -l)
        echo "Downloaded ${downloaded}/${last_page} pages."
        if [ "$downloaded" -ne "$last_page" ]; then
          echo "Some pages failed to download."
          exit 1
        fi

  animethemes:manifest:
    desc: Process downloaded GraphQL pages and build manifest
    summary: |
      Requires: jq, awk, sha256sum
      Reads .cache/pages/*.json, writes data/<id>.json (minified),
      and builds data/manifest.json with sha256 checksums + MAL ID lookups.
    silent: true
    cmds:
      - |
        set -euo pipefail

        cache_dir=".cache/pages"
        out_dir="./data"
        mkdir -p "$out_dir"

        if [ -z "$(ls "$cache_dir"/*.json 2>/dev/null)" ]; then
          echo "No pages found in ${cache_dir}. Run 'task animethemes:download' first."
          exit 1
        fi

        manifest_path="$out_dir/manifest.json"
        now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT

        # 1) Flatten all pages into one JSONL stream of unique anime
        #    (deduped by id; CREATED_AT sort means the first occurrence
        #    is already the freshest in the same fetch).
        flat_jsonl="$work_dir/anime.jsonl"
        jq -s -c '
          [ .[] | .data.animePagination.data[] ]
          | group_by(.id)
          | map(.[0])
          | .[]
        ' "$cache_dir"/*.json > "$flat_jsonl"
        flat_count=$(wc -l < "$flat_jsonl")
        echo "Flattened ${flat_count} unique anime from pages."

        # 2) Fan out: write each anime as data/<id>.json via a single awk pass
        awk -v dir="$out_dir" '
          {
            if (match($0, /"id":[0-9]+/)) {
              id = substr($0, RSTART + 5, RLENGTH - 5)
              path = dir "/" id ".json"
              print $0 > path
              close(path)
            }
          }
        ' "$flat_jsonl"

        # 3) Compute sha256 of every data/<id>.json in one pass
        sha_file="$work_dir/sha256.tsv"
        (cd "$out_dir" && find . -maxdepth 1 -type f -name '[0-9]*.json' -print0 \
          | xargs -0 sha256sum) \
          | awk '{ sub(/^\.\//, "", $2); sub(/\.json$/, "", $2); print $2 "\t" $1 }' \
          > "$sha_file"

         # 4) Build a JSONL of {id, malID} from the flat anime stream
         meta_jsonl="$work_dir/meta.jsonl"
         jq -c '
           {
             id: .id,
             malID: ((.resources.nodes // []) | map(select(.site == "MAL")) | (.[0].externalId // null))
           }
         ' "$flat_jsonl" > "$meta_jsonl"

         # 5) Convert shas TSV to JSON array
         sha_json="$work_dir/sha256.json"
         jq -R -s '
           split("\n") | map(select(length>0))
           | map(split("\t") | {id: (.[0] | tonumber), sha256: .[1]})
         ' "$sha_file" > "$sha_json"

        meta_json="$work_dir/meta.json"
        jq -s '.' "$meta_jsonl" > "$meta_json"

        old_json="$work_dir/old.json"
        if [ -f "$manifest_path" ]; then
          cp "$manifest_path" "$old_json"
        else
          echo "[]" > "$old_json"
        fi

         # 6) Build merged manifest:
         #    - entries seen in this run get fresh sha + url (timestamps preserved
         #      when sha is unchanged)
         #    - entries NOT seen in this run are kept verbatim from the existing
         #      manifest, so partial/incremental cache runs are safe
         jq -n \
           --slurpfile meta "$meta_json" \
           --slurpfile shas "$sha_json" \
           --slurpfile old "$old_json" \
           --arg now "$now" \
           --arg base "https://${GITHUB_PAGES_URL}" \
           '
             ($meta[0]) as $entries
             | (($shas[0]) | map({key: (.id|tostring), value: .sha256}) | from_entries) as $sha_by_id
             | (($old[0])  | map({key: (.id|tostring), value: .}) | from_entries) as $old_by_id
             | ($entries | map({key: (.id|tostring), value: true}) | from_entries) as $seen
             | (
                 $entries
                 | map(
                     . as $e
                     | ($sha_by_id[$e.id|tostring]) as $sha
                     | ($old_by_id[$e.id|tostring] // null) as $prev
                     | {
                         id: $e.id,
                         malID: $e.malID,
                         url: ($base + "/" + ($e.id|tostring) + ".json"),
                         sha256: $sha,
                         createdAt: (if $prev == null then $now else $prev.createdAt end),
                         updatedAt: (if $prev == null then $now
                                     elif $prev.sha256 == $sha then $prev.updatedAt
                                     else $now end)
                       }
                   )
               )
               + (($old[0]) | map(select($seen[.id|tostring] | not)))
             | sort_by(.id)
           ' > "$manifest_path"

         # 7) Stats: bucketed by IDs actually seen in this run
         stats=$(jq -n \
           --slurpfile new "$manifest_path" \
           --slurpfile old "$old_json" \
           --slurpfile meta "$meta_json" \
           '
             ($old[0] | map({key:(.id|tostring), value:.sha256}) | from_entries) as $old_sha
             | ($meta[0] | map({key:(.id|tostring), value:true}) | from_entries) as $seen
             | ($new[0] | map({key:(.id|tostring), value:.sha256}) | from_entries) as $new_sha
             | {
                 total:     ($new[0] | length),
                 new:       ($meta[0] | map(select($old_sha[.id|tostring] == null)) | length),
                 updated:   ($meta[0] | map(select($old_sha[.id|tostring] != null and $old_sha[.id|tostring] != $new_sha[.id|tostring])) | length),
                 unchanged: ($meta[0] | map(select($old_sha[.id|tostring] == $new_sha[.id|tostring])) | length),
                 kept:      ($new[0] | map(select($seen[.id|tostring] | not)) | length)
               }
           ')
        total=$(echo "$stats" | jq -r '.total')
        new_count=$(echo "$stats" | jq -r '.new')
        updated_count=$(echo "$stats" | jq -r '.updated')
        unchanged_count=$(echo "$stats" | jq -r '.unchanged')
        kept_count=$(echo "$stats" | jq -r '.kept')
        echo "Done. Manifest: ${total} entries (${new_count} new, ${updated_count} updated, ${unchanged_count} unchanged, ${kept_count} kept from previous run)."

        rm -rf "$cache_dir"

  animethemes:reconcile:
    desc: Report manifest entries that no longer exist upstream
    summary: |
      Requires: curl, jq
      Enumerates every upstream anime id with a minimal `{ id }` query
      (~1 KB per page, versus ~600 KB for a full data page) and diffs the
      result against data/manifest.json. Writes .cache/reconcile.json:

        {"upstreamTotal": N, "manifestTotal": M,
         "orphaned": [ids in the manifest but no longer upstream],
         "missing":  [ids upstream but not in the manifest]}

      Finding orphans is NOT an error — this task exits 0 so a scheduled run
      never fails the build. It exits non-zero only when the sweep itself is
      incomplete, because a partial sweep would report false orphans.
    silent: true
    cmds:
      - |
        set -euo pipefail

        manifest_path="./data/manifest.json"
        if [ ! -f "$manifest_path" ]; then
          echo "No manifest at ${manifest_path}. Run 'task animethemes:fetch' first." >&2
          exit 1
        fi

        page_size="${ANIMETHEMES_PAGE_SIZE:-100}"
        workers="${ANIMETHEMES_DOWNLOAD_WORKERS:-4}"
        if ! [[ "$workers" =~ ^[1-9][0-9]*$ ]]; then
          workers=4
        fi

        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT
        pages_dir="$work_dir/pages"
        mkdir -p "$pages_dir"

        # CREATED_AT: the id set is sort-independent, but a stable sort keeps
        # page boundaries from shifting mid-sweep as anime are updated.
        probe_payload=$(
          jq -nc --argjson first "$page_size" '
            {query:"query Probe($first: Int!) { animePagination(first: $first, page: 1, sort: CREATED_AT) { paginatorInfo { lastPage total } } }",
             variables:{first:$first},
             operationName:"Probe"}'
        )

        probe_file="$work_dir/probe.json"
        curl --fail --max-time 30 --connect-timeout 10 --http1.1 -sS \
          -X POST "${ANIMETHEMES_ENDPOINT}" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          -H "Origin: ${ANIMETHEMES_ENDPOINT%/}" \
          -H "Referer: ${ANIMETHEMES_ENDPOINT}" \
          -H 'User-Agent: animethemes-moe-tracker/1.0' \
          --data "$probe_payload" \
          -o "$probe_file"

        last_page=$(jq -r '.data.animePagination.paginatorInfo.lastPage // "null"' "$probe_file")
        upstream_total=$(jq -r '.data.animePagination.paginatorInfo.total // "null"' "$probe_file")
        if ! [[ "$last_page" =~ ^[1-9][0-9]*$ ]]; then
          echo "Reconcile: probe returned no usable lastPage:" >&2
          cat "$probe_file" >&2
          exit 1
        fi
        if [ "$workers" -gt "$last_page" ]; then
          workers="$last_page"
        fi

        echo "Reconcile: sweeping ${last_page} page(s) of ids (upstream total: ${upstream_total})."

        worker="$work_dir/fetch_ids.sh"
        cat > "$worker" <<'WORKER'
        #!/usr/bin/env bash
        set -euo pipefail
        page="$1"
        endpoint="${ANIMETHEMES_ENDPOINT:?}"
        page_size="${ANIMETHEMES_PAGE_SIZE:-100}"
        pages_dir="${PAGES_DIR:?}"

        payload="$(jq -nc --argjson page "$page" --argjson first "$page_size" '
          {query:"query Ids($page: Int!, $first: Int!) { animePagination(first: $first, page: $page, sort: CREATED_AT) { data { id } } }",
           variables:{page:$page,first:$first},
           operationName:"Ids"}')"

        tmp_response="$(mktemp)"
        trap 'rm -f "$tmp_response"' EXIT

        attempt=1
        max_attempts=4
        success=0
        while [ "$attempt" -le "$max_attempts" ]; do
          if curl --fail --max-time 30 --connect-timeout 10 --http1.1 -sS \
              -X POST "$endpoint" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Origin: ${endpoint%/}" \
              -H "Referer: $endpoint" \
              -H 'User-Agent: animethemes-moe-tracker/1.0' \
              --data "$payload" \
              -o "$tmp_response"; then
            success=1
            break
          fi
          echo "Reconcile page ${page}: curl failed (attempt ${attempt}/${max_attempts})." >&2
          attempt=$((attempt + 1))
          sleep $((attempt * 2))
        done

        if [ "$success" -ne 1 ]; then
          echo "Reconcile page ${page}: giving up after ${max_attempts} attempts." >&2
          exit 1
        fi

        if [ "$(jq -r '(.data.animePagination.data | type) // "missing"' "$tmp_response")" != "array" ]; then
          echo "Reconcile page ${page}: response contained no data array." >&2
          head -c 500 "$tmp_response" >&2
          echo >&2
          exit 1
        fi

        jq -r '.data.animePagination.data[].id' "$tmp_response" > "$pages_dir/${page}.ids"
        WORKER
        chmod +x "$worker"

        export ANIMETHEMES_ENDPOINT
        export ANIMETHEMES_PAGE_SIZE
        export PAGES_DIR="$pages_dir"

        seq 1 "$last_page" | xargs -P "$workers" -n 1 "$worker"

        swept=$(ls "$pages_dir"/*.ids 2>/dev/null | wc -l)
        if [ "$swept" -ne "$last_page" ]; then
          echo "Reconcile: only swept ${swept}/${last_page} pages; refusing to report a partial diff." >&2
          exit 1
        fi

        ids_file="$work_dir/upstream.ids"
        cat "$pages_dir"/*.ids | sort -n -u > "$ids_file"

        mkdir -p .cache
        report=".cache/reconcile.json"
        jq -n \
          --rawfile ids "$ids_file" \
          --slurpfile man "$manifest_path" \
          --arg generated_at "$(date -u +%s)" \
          '
            ($ids | split("\n") | map(select(length > 0) | tonumber)) as $upstream
            | ($upstream | map({key:(.|tostring), value:true}) | from_entries) as $up_set
            | ($man[0]) as $entries
            | ($entries | map({key:(.id|tostring), value:true}) | from_entries) as $man_set
            | {
                generatedAt: ($generated_at | tonumber),
                upstreamTotal: ($upstream | length),
                manifestTotal: ($entries | length),
                orphaned: ($entries | map(select($up_set[.id|tostring] | not) | .id) | sort),
                missing:  ($upstream | map(select($man_set[.|tostring] | not)) | sort)
              }
          ' > "$report"

        orphaned_count=$(jq '.orphaned | length' "$report")
        missing_count=$(jq '.missing | length' "$report")
        manifest_total=$(jq '.manifestTotal' "$report")

        echo "Reconcile: manifest ${manifest_total} entries vs upstream ${upstream_total}."
        echo "  orphaned (gone upstream): ${orphaned_count}"
        echo "  missing (not yet tracked): ${missing_count}"
        if [ "$orphaned_count" -gt 0 ]; then
          echo "  orphaned ids: $(jq -r '.orphaned | join(", ")' "$report")"
          echo "  -> remove with: task animethemes:prune PRUNE=1"
        fi
        if [ "$missing_count" -gt 0 ]; then
          echo "  missing ids: $(jq -r '.missing | join(", ")' "$report")"
          echo "  -> pick up with: task animethemes:fetch"
        fi
        echo "Report written to ${report}."

  animethemes:prune:
    desc: Delete tracked anime that no longer exist upstream (opt-in)
    summary: |
      Requires: curl, jq
      Runs a reconcile sweep, then for every orphaned id:
        - deletes data/<id>.json
        - drops its entry from data/manifest.json

      Deliberately opt-in: dry-runs unless PRUNE=1 (accepts 1/true).

      Consumes the report from a preceding `animethemes:reconcile` run rather
      than sweeping again, so a prune costs no extra API requests:

        task animethemes:reconcile && task animethemes:prune PRUNE=1

      Guarded three ways:
        - PRUNE=1 must be passed explicitly (otherwise it dry-runs)
        - the report must be newer than ANIMETHEMES_PRUNE_MAX_REPORT_AGE
          seconds (default 3600), so a stale sweep can't drive deletions
        - orphans must not exceed ANIMETHEMES_PRUNE_MAX_PERCENT (default 1)
          of the manifest, so an upstream incident cannot mass-delete the
          corpus. Raise it only after confirming the deletions are genuine.
    silent: true
    cmds:
      - |
        set -euo pipefail

        report=".cache/reconcile.json"
        manifest_path="./data/manifest.json"
        if [ ! -f "$report" ]; then
          echo "No ${report}. Run 'task animethemes:reconcile' first." >&2
          exit 1
        fi

        max_age="${ANIMETHEMES_PRUNE_MAX_REPORT_AGE:-3600}"
        generated_at=$(jq -r '.generatedAt // 0' "$report")
        age=$(( $(date -u +%s) - generated_at ))
        if [ "$generated_at" -le 0 ]; then
          echo "Report ${report} has no generatedAt; re-run 'task animethemes:reconcile'." >&2
          exit 1
        fi
        if [ "$age" -gt "$max_age" ]; then
          echo "Report ${report} is ${age}s old (limit ${max_age}s); re-run 'task animethemes:reconcile'." >&2
          exit 1
        fi

        orphaned_count=$(jq '.orphaned | length' "$report")
        manifest_total=$(jq '.manifestTotal' "$report")

        if [ "$orphaned_count" -eq 0 ]; then
          echo "Prune: no orphaned entries. Nothing to do."
          exit 0
        fi

        max_percent="${ANIMETHEMES_PRUNE_MAX_PERCENT:-1}"
        if ! [[ "$max_percent" =~ ^[0-9]+$ ]]; then
          echo "Invalid ANIMETHEMES_PRUNE_MAX_PERCENT: '${max_percent}' (expected an integer)." >&2
          exit 1
        fi

        # Scaled integer comparison: orphans/total > max/100.
        if [ "$manifest_total" -le 0 ] || [ $((orphaned_count * 100)) -gt $((max_percent * manifest_total)) ]; then
          echo "Prune: refusing to delete ${orphaned_count}/${manifest_total} entries — exceeds ${max_percent}% guard." >&2
          echo "Verify upstream is healthy, then re-run with ANIMETHEMES_PRUNE_MAX_PERCENT set higher." >&2
          exit 1
        fi

        # Task var, so both `task animethemes:prune PRUNE=1` (matching PAGE on
        # download:page) and an exported PRUNE resolve here.
        prune="{{.PRUNE}}"
        case "$prune" in
          1|true)     prune=1 ;;
          ''|0|false) prune=0 ;;
          *)
            echo "Invalid PRUNE: '${prune}' (expected 1/true or 0/false)." >&2
            exit 1
            ;;
        esac

        if [ "$prune" -ne 1 ]; then
          echo "Prune: ${orphaned_count} orphaned entr(y/ies) would be deleted:"
          jq -r '.orphaned[] | "  - data/\(.).json"' "$report"
          echo "Dry run. Re-run with PRUNE=1 to apply."
          echo "  task animethemes:prune PRUNE=1"
          exit 0
        fi

        deleted=0
        while read -r id; do
          [ -n "$id" ] || continue
          if [ -f "./data/${id}.json" ]; then
            rm -f "./data/${id}.json"
            echo "Deleted data/${id}.json"
            deleted=$((deleted + 1))
          else
            echo "data/${id}.json already absent; dropping manifest entry only."
          fi
        done < <(jq -r '.orphaned[]' "$report")

        tmp_manifest="$(mktemp)"
        trap 'rm -f "$tmp_manifest"' EXIT
        jq \
          --slurpfile rep "$report" \
          '
            (($rep[0].orphaned) | map({key:(.|tostring), value:true}) | from_entries) as $drop
            | map(select($drop[.id|tostring] | not))
            | sort_by(.id)
          ' "$manifest_path" > "$tmp_manifest"
        mv "$tmp_manifest" "$manifest_path"
        trap - EXIT

        remaining=$(jq 'length' "$manifest_path")
        echo "Pruned ${deleted} file(s). Manifest: ${remaining} entries."

  animethemes:clean:
    desc: Remove cache and generated data directories
    silent: true
    cmds:
      - |
        rm -rf .cache/pages
        rm -rf ./data
        echo "Cleaned .cache/pages and data/."
